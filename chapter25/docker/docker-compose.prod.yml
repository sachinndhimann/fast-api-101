# Production-shaped compose file: explicit resource limits, restart policy,
# and healthcheck-gated startup ordering -- contrast with the root
# docker-compose.yml, which is dev-only convenience with none of this.
version: "3.9"
services:
  api:
    build:
      context: ../..
      dockerfile: chapter25/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
